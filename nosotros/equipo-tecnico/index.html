  <title>Perfil del equipo | Grindlane Consulting</title>
  <script>
    // Preserve historical person anchors, including #Daniel and #daniel-martinez.
    (() => {
      const profiles = {"felipe":"/nosotros/felipe/","felipe-parra":"/nosotros/felipe/","daniel":"/nosotros/daniel/","daniel-martinez":"/nosotros/daniel/","francisco":"/nosotros/francisco/","francisco-arias":"/nosotros/francisco/"};
      let person = "";
      try { person = decodeURIComponent(window.location.hash.slice(1)).toLowerCase(); } catch {}
      const target = Object.hasOwn(profiles, person) ? profiles[person] : "/nosotros/felipe/";
      window.location.replace(target);
    })();
  </script>
